<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Updating in Progress</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .emoji {
      font-size: 3.5rem;
      margin-bottom: 20px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .typewriter {
      font-size: 1.5rem;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #ffffff;
      width: 0;
      animation: typing 4s steps(40, end) forwards, blink 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    p {
      margin-top: 30px;
      font-size: 1rem;
      color: #bbbbbb;
    }

    @media (max-width: 600px) {
      .emoji {
        font-size: 2.5rem;
      }

      h1 {
        font-size: 2.5rem;
      }

      .typewriter {
        font-size: 1.2rem;
      }

      p {
        font-size: 0.9rem;
      }

      .container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🛠️</div>
    <h1>Website Update in Progress</h1>
    <div class="typewriter">We're currently working on updates and improvements.</div>
    <p>Thank you for your patience!</p>
  </div>
</body>
</html>
